<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- Celular: "Agregar a pantalla de inicio" lo abre a pantalla completa -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>BOLIVIA SLUG</title>
  <link rel="icon" href="data:,">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    #juego { width: 100vw; height: 100vh; background: #000; }
    canvas { display: block; image-rendering: pixelated; }

    /* Controles táctiles (src/Tactil.js): solo con la clase .tactil */
    html.tactil, html.tactil body { touch-action: none; -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
    #tactil { position: fixed; inset: 0; pointer-events: none; z-index: 10;
      font-family: 'Press Start 2P', monospace; color: #fff6d0; }
    #tactil .cruz, #tactil .boton { position: absolute; pointer-events: auto; touch-action: none; }
    #tactil .cruz { left: calc(18px + env(safe-area-inset-left)); bottom: 16px; width: 36vh; height: 36vh;
      max-width: 190px; max-height: 190px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.10) 0 38%, rgba(0,0,0,0.28) 39% 100%);
      border: 2px solid rgba(255,230,150,0.35); }
    #tactil .perilla { position: absolute; left: 50%; top: 50%; width: 38%; height: 38%; margin: -19% 0 0 -19%;
      border-radius: 50%; background: radial-gradient(circle at 35% 30%, rgba(255,240,190,0.55), rgba(120,100,60,0.45));
      border: 2px solid rgba(255,230,150,0.6); transition: transform 0.05s; }
    #tactil .f { position: absolute; font-size: 11px; opacity: 0.55; text-shadow: 1px 1px 0 #000; }
    #tactil .f.activo { opacity: 1; color: #ffd23f; }
    #tactil .arriba { top: 6%; left: 50%; transform: translateX(-50%); }
    #tactil .abajo { bottom: 6%; left: 50%; transform: translateX(-50%); }
    #tactil .izq { left: 7%; top: 50%; transform: translateY(-50%); }
    #tactil .der { right: 7%; top: 50%; transform: translateY(-50%); }
    #tactil .boton { display: flex; align-items: center; justify-content: center; border-radius: 50%;
      width: 19vh; height: 19vh; max-width: 96px; max-height: 96px; font-size: 9px; letter-spacing: 1px;
      text-shadow: 1px 1px 0 #000; background: rgba(0,0,0,0.32); border: 3px solid rgba(255,230,150,0.45);
      box-shadow: inset 0 -4px 0 rgba(0,0,0,0.3); }
    #tactil .boton.activo { background: rgba(255,210,63,0.45); border-color: #ffd23f; transform: scale(0.93); }
    #tactil .fuego { right: calc(18px + env(safe-area-inset-right)); bottom: 22px; width: 23vh; height: 23vh;
      max-width: 116px; max-height: 116px; border-color: rgba(255,120,80,0.6); font-size: 10px; }
    #tactil .salto { right: calc(26px + 26vh + env(safe-area-inset-right)); bottom: 12px; }
    #tactil .arma { right: calc(18px + 4vh + env(safe-area-inset-right)); bottom: calc(26vh + 30px);
      width: 14vh; height: 14vh; max-width: 70px; max-height: 70px; font-size: 7px; }
    #tactil .mini { width: 11vh; height: 11vh; max-width: 54px; max-height: 54px; border-radius: 12px; font-size: 8px; top: 10px; }
    #tactil .pausa { right: calc(14px + env(safe-area-inset-right)); }
    #tactil .ok { right: calc(24px + 11vh + env(safe-area-inset-right)); }
    #tactil .girar { display: none; position: fixed; inset: 0; pointer-events: auto; background: #000;
      align-items: center; justify-content: center; flex-direction: column; text-align: center;
      font-size: 12px; line-height: 2; color: #ffd23f; }
    #tactil .girar .icono { font-size: 48px; animation: girar 1.6s ease-in-out infinite; }
    @keyframes girar { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(90deg); } }
    @media (orientation: portrait) { html.tactil #tactil .girar { display: flex; } }
  </style>
</head>
<body>
  <div id="juego"></div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="src/TextFX.js"></script>
  <script src="src/Musica.js"></script>
  <script src="src/scenes/EfectosMenu.js"></script>
  <script src="src/scenes/FondoMenu.js"></script>
  <script src="src/scenes/Menu.js"></script>
  <script src="src/scenes/CharacterSelectScene.js"></script>
  <script src="src/scenes/TerrenoNatural.js"></script>
  <script src="src/Efectos.js"></script>
  <script src="src/Armas.js"></script>
  <script src="src/Jugador.js"></script>
  <script src="src/Admin.js"></script>
  <script src="src/CuerpoTuto.js"></script>
  <script src="src/Estado.js"></script>
  <script src="src/scenes/Nivel1.js"></script>
  <script src="src/Soldados.js"></script>
  <script src="src/scenes/Interior.js"></script>
  <script src="src/scenes/Cueva.js"></script>
  <script src="src/scenes/JefeFinal.js"></script>
  <script src="src/scenes/Pausa.js"></script>
  <script src="src/Tactil.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
